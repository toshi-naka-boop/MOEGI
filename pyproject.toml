[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moegi"
version = "0.1.0"
description = "通達Diff→現場手順自動更新エージェント（訪問看護向け）"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber==0.11.10",
    "httpx==0.28.1",
    "fastapi==0.118.0",
    "uvicorn==0.37.0",
    "python-multipart==0.0.20",
    "faster-whisper==1.2.1",
    "weasyprint==69.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]
