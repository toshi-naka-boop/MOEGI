[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moegi"
version = "0.1.0"
description = "通達Diff→現場手順自動更新エージェント（訪問看護向け）"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber==0.11.10",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]
