# MOEGI G9 ゴールドセット（design.md §3 G9・§10 D3）
#
# allowlist全6ラベル（d, e, c, ab, g_a, g_i）× sitedoc_sample.toml の8項目に、
# 実際の通達本文を読んだ上で人手（Claude）で `要更新/影響なし` を付けた正解表。
#
# 判定基準は pipeline.py の一括プロンプトに明文化した基準と同じ:
#   「この通達変更が要求する内容を書き加えないと、その項目が通達に適合しなくなる場合だけ
#    "要更新"。項目の書きぶりの良し悪しや、記録が実際に行われているかは判定対象ではない」
#
# ⚠️ 免責: これは看護・法務の専門家レビューを経ていない。Claudeが通達原文と
# チェックリスト文言を突き合わせて作った一次判定であり、特に ab の item1（開始・終了時刻）
# は「明確化」か「義務化」かで割れる可能性がある論点（ledger N-4・未解決）を含んだまま、
# 「実質的な文言変更があるなら要更新」という recall 優先の立場で判定した。
# 各セルに rationale を付けたので、レビューし直す場合はそこを見ること。
#
# new_item_expected は「完全新設(kind=追加)以外」でのみ意味を持つ。
# 完全新設4件（e, c, g_a, g_i）は design.md v11（ledger N-7）により、LLMの判定に関わらず
# 新規項目提案が常に強制生成されるため、この次元はG9の再現率測定の対象外
# （測っても常に100%になる＝ルールの検証にしかならず、モデル品質の指標にならない）。

