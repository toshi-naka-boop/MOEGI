# MOEGI モデル設定（design.md §6.1・§6.3・§14）
#
# 接続情報は .env に置かない（CLAUDE.md の .env 禁止規約）。
# APIキーの解決順は 環境変数 ORCA_API_KEY > macOSキーチェーン（service = "orca-api"）。
# シェルのexport継承に依存しないので、起動経路が変わっても認証は切れない（ledger R-66）。
# ORCA_BASE_URL は未設定なら https://api.orcarouter.ai/v1。末尾の /v1 の有無はどちらでもよい。
#
# dev_local_only = true にすると全工程がローカル（Ollama）固定になる（デバッグ用）。
# 既定は false＝クラウド経路（design.md §6.1・v13・ledger N-11）。
#
# ローカル固定が必要なのは要配慮個人情報（患者の医療・看護情報）を扱う工程だけ
# （§6.1「ルーティングの第一原則」v13）。SiteDoc/ChecklistItemは項目ラベルの
# テンプレート定義であり患者データを含まないため、matching/draftも他の工程と同じく
# クラウドが既定。ローカル固定が必要なのは日報エージェント（transcribe/structure・
# 未実装）だけで、そちらはこのモデル設定を経由しない別系統になる予定（ledger N-11）。
dev_local_only = false

# design.md §7「投入単位と突合のバッチ化」(v11)。
# true = 変更1件 × チェックリスト全項目を1プロンプトで一括判定。
# false = 1項目=1呼び出しの単発モード。
# ⚠️ 承認条件2により、一括を既定にしてよいのは D4 のゴールドセットで単発と一括の
#    再現率を比較し、G9主指標が劣化しないことを確認してから。
#    D2実測では一括は速い（27.9秒 vs 117.9秒）が検出0件だった（ledger R-65）ため、
#    確認が済むまで既定は単発に置く。D4で判定したらこの1行を切り替える。
batch_matching = false

# 単価は ORCA の単価表どおり $/1M で書く。円換算は llm.py が
# price_usd_per_1m_* × usd_jpy_rate ÷ 1000 で行う（design.md §6.3 の原価対比表もここに従う）。
# ⚠️ 為替レートは前提（design.md §11・ledger R-62）。実勢と乖離したらこの1行を直す。
usd_jpy_rate = 155.0

[diff]
# ②差分抽出（高頻度・軽処理）。候補モデルは未確定。
# scripts/compare_models.py で1サンプルずつ比較してから確定する。
backend = "orca"
model = "anthropic/claude-haiku-4.5"  # 候補1（暫定・未確定）
# 候補2: model = "google/gemini-3.6-flash"        # $1.50 / $7.50
# 候補3: model = "deepseek/deepseek-v4-flash"     # $0.147 / $0.295
# 候補4: model = "orcarouter/fusion"              # 従量課金・単価は選択先依存で事前に確定できない
# ledger R-79: cloud_fallback_model で orcarouter/auto の疎通を実測確認済み（旧R-64「未疎通」を解消）。
# 実測ではqwen/qwen3.7-plus等に解決される。主モデル失敗時、ローカルに落ちる前にこちらを試す。
cloud_fallback_model = "orcarouter/auto"
fallback_backend = "local"
# ledger R-79（ユーザー決定・2026-08-11）: ローカル最終フォールバックをTanuki 7B→gemma4:26bに
# 切り替え。reasoning_effort修正済み（N-11）でgemma4:26bはTanuki同等以上の速度・より高い
# 精度が見込めるため、事務所内処理（要配慮個人情報を含まない本パイプライン）でも上位互換。
fallback_model = "gemma4:26b"
reasoning_effort = "none"
price_usd_per_1m_in = 1.00
price_usd_per_1m_out = 5.00

[requirement]
# ③-a 要件抽出（高精度枠）。通達本文のみが入るため公開情報しか流れない＝クラウドで堂々と使える。
backend = "orca"
model = "anthropic/claude-sonnet-5"
# 最終ゴールデン実行時はここを切り替える:
# model = "anthropic/claude-opus-5"   # $5.00 / $25.00
cloud_fallback_model = "orcarouter/auto"  # ledger R-79
fallback_backend = "local"
fallback_model = "gemma4:26b"  # ledger R-79
reasoning_effort = "none"
price_usd_per_1m_in = 2.00
price_usd_per_1m_out = 10.00

[matching]
# ③-b 突合（v13・ledger N-11でクラウド解禁）。入力は要件文＋通達原文の抜粋＋
# チェックリスト項目ラベルのみで、要配慮個人情報を含まない（pipeline.py は
# ChecklistItem.label/kind しかプロンプトに渡さない。goal_ref等は渡さないことを
# テストで固定している＝tests/test_pipeline.py の goal_ref 非流出テスト）。
# ローカル7Bモデルでの実測がN-8（過剰検出）・N-9（低再現率）・N-10（逐語引用の崩れ）の
# 主因だったため、③-aと同格の高精度モデルに上げる。
backend = "orca"
model = "anthropic/claude-sonnet-5"
cloud_fallback_model = "orcarouter/auto"  # ledger R-79
fallback_backend = "local"
fallback_model = "gemma4:26b"  # ledger R-79
reasoning_effort = "none"
price_usd_per_1m_in = 2.00
price_usd_per_1m_out = 10.00
# 一括判定は「全項目ぶんのJSON」を1回で吐かせるため、単発時より出力が長く時間もかかる。
# 上限を切りすぎるとJSONが途中で切れて全項目が判定不能になるので、項目数×約80トークンを目安に置く。
max_output_tokens = 900
local_timeout_seconds = 120.0

[draft]
# ④更新案生成（v13・ledger N-11でクラウド解禁）。入力はimpact.rationale・evidence・
# チェックリスト項目ラベルのみで、matchingと同じ理由で要配慮個人情報を含まない。
backend = "orca"
model = "anthropic/claude-haiku-4.5"
cloud_fallback_model = "orcarouter/auto"  # ledger R-79
fallback_backend = "local"
fallback_model = "gemma4:26b"  # ledger R-79
reasoning_effort = "none"
price_usd_per_1m_in = 1.00
price_usd_per_1m_out = 5.00
# design.md §6.6（v10）: D2実測でdraftが最も長く、唯一ローカルtimeout（60秒）を
# 超えた工程だった。出力は「更新後の項目文言を1〜2文」で足りるため上限を設ける。
# 一括モードでは要更新と判定された項目ぶんをまとめて生成するため、単発の200では足りない。
max_output_tokens = 700
local_timeout_seconds = 120.0

[nippou]
# 日報エージェントのstructure()（design.md §6.5）。患者の実際の看護記録を扱う
# 唯一の工程のため、設計上ローカル固定（backend="local"以外はllm.pyが拒否する）。
backend = "local"
model = "gemma4:26b"
# opus批評C-11・ledger N-11: gemma4:26bはreasoningモデル。これが無いと出力トークン予算が
# reasoningに全消費されcontentが空になる（実測: 21秒・本文0字 → "none"指定で10秒・正しいJSON）。
reasoning_effort = "none"
# 日報1件の構造化は評価付きでも数百字程度。大きめに余裕を持たせる。
max_output_tokens = 900
# R-70実測（単発呼び出し平均70秒）はreasoning_effort未設定時の値で、上記の修正後は
# コールド17.8秒／ウォーム3.4秒まで改善している（D5実測・opus批評C-11で決着）。
# それでも余裕を持たせておく。
local_timeout_seconds = 180.0
