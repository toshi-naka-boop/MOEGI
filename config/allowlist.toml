# MOEGI D1 allowlist（design.md §2 表 a〜g のうち、保発0305第19号の対象条文パス）
#
# 「適正な訪問看護の推進」に関する対象5項目（a・b・c・d・e・g。fの告示74号は
# 本ラウンドで取得したPDFの対象外なので含まない）。
#
# old_path: 旧通知（保発0305第12号）における対応箇所。
#   - 新旧で項番がずれている場合は、ずれた後の実際のパスを書く（例: ab は
#     新設項目(e・c)が割り込んだことで新→旧で項番が-2ずれている）。
#   - 旧文書に対応する条文が存在しない項目（完全新設）は空文字列にする。
#     空文字列の場合、同じパス文字列を旧文書にも使い回さない
#     （旧文書の同名パスには無関係な内容が入っており、誤って対象にしてしまうため。
#     D1での実PDF照合で確認済み。詳細はレポート参照）。

[[targets]]
label = "d"
title = "標準時間を下回る訪問の厳格化"
new_path = "第4の2"
old_path = "第4の2"
note = "新設ではなく既存条項への追記（「なお、」以降が新設）。新旧とも同一パス。"

[[targets]]
label = "e"
title = "一律の訪問日数等の禁止"
new_path = "第4の3"
old_path = ""
note = "完全新設。旧文書の第4の3は無関係な内容（初回訪問時の記録）であり対応箇所ではない。"

[[targets]]
label = "c"
title = "評価の記録"
new_path = "第4の4"
old_path = ""
note = "完全新設。旧文書の第4の4は無関係な内容（毎回訪問時の記録・開始終了時刻＝ab の旧版）であり対応箇所ではない。"

[[targets]]
label = "ab"
title = "記録書への実施内容・所要時間／開始・終了時刻の記録（明確化）"
new_path = "第4の6"
old_path = "第4の4"
note = "新設ではなく明確化。新設項目(e・c)が割り込んだため、新→旧で項番が-2ずれている。"

[[targets]]
label = "g_a"
title = "短時間訪問の分割禁止（適切な時間の実施・記録）"
new_path = "第2の2(4)ア"
old_path = ""
note = "完全新設。旧文書の第2の2(4)にア・イの枝番構造自体が存在しない。"

[[targets]]
label = "g_i"
title = "短時間訪問の分割禁止（2時間未満間隔の合算）"
new_path = "第2の2(4)イ"
old_path = ""
note = "完全新設。旧文書の第2の2(4)にア・イの枝番構造自体が存在しない。"
