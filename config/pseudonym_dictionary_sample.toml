# MOEGI 仮名化ローカル辞書（合成データ・design/moegi/privacy.md §辞書）
#
# ⚠️ 実在する患者・家族・職員・医療機関の情報は一切含まない完全な架空データ。
#    config/sitedoc_sample.toml と同じ扱いで、実運用では事業所側の実マスタに差し替える。
#
# ⚠️ この辞書の内容は外部へ送信しない。ローカルLLMのプロンプトにも入れない
#    （辞書は突き合わせにのみ使い、突き合わせはコード側で行う）。
#
# code: 事業所内の利用者コード。日報の保存・月報の集計で「誰の記録か」を決めるために使う。
#   ⚠️ コードそのものは日報DBに保存しない。保存するのはこのコードから鍵つきHMACで導出した
#      安定仮名（PATIENT_xxxxxxxx）だけ（vault.stable_pseudonym）。
#   同姓同名（鈴木 一郎）はコードで区別する——氏名だけでは一意に決められないため。
#
# aliases: 音声認識で表記が崩れた形・読み・愛称・略称。完全一致で照合する。
# surname_needs_honorific = true（既定）の姓は、「さん/様/氏/先生/ちゃん」等の
# 敬称を伴う場合だけ検出する（一般名詞との衝突を避けるため）。

[[patients]]
